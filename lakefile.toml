  "FHM.Pretty",
  "FHM.SpikeC",
  "FHM.InferW",
  "FHM.SurfaceBridge",
  "FHM.Examples",
]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.26.0"
