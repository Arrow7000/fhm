name = "FHM"
version = "0.1.0"
defaultTargets = ["FHM"]

[[lean_lib]]
name = "FHM"
# Default build target = the verified stack.
roots = [
  "FHM.Core",
  "FHM.CorePath",
  "FHM.Decls",
  "FHM.SurfaceLang",
  "FHM.Surface.Token",
  "FHM.Surface.Span",
  "FHM.PatComp",
  "FHM.Pretty",
  "FHM.InferW",
  "FHM.Completeness",
  "FHM.SurfaceBridge",
  "FHM.Scc.Kosaraju",
  "FHM.Examples",
  "FHM.Headlines",
]

[[lean_lib]]
name = "FHMUnverified"
# Operational front end and evaluator; not part of the default verified stack.
roots = [
  "FHM.Unverified.HMArtifacts",
  "FHM.Unverified.HMDisplay",
  "FHM.Unverified.BoundsFrontend",
  "FHM.Unverified.Surface.Lex",
  "FHM.Unverified.Surface.Parse",
  "FHM.Unverified.Surface.Provenance",
  "FHM.Unverified.Surface.CountScope",
  "FHM.Unverified.EvaluateUnsafe",
]

[[lean_lib]]
name = "FHMEditor"
# Hover/diagnose helpers — built with `fhm`, not default `lake build`.
roots = ["FHM.Unverified.EditorSupport"]

[[lean_lib]]
name = "FHMEditorTests"
# Span-hover canaries — `lake build FHMEditorTests`.
roots = ["FHM.Unverified.EditorSupportTests"]

[[lean_lib]]
name = "FHMCli"
# Unified CLI modules — `lake build fhm`.
# Live `--bl` invokes the canonical proof-producing checker; operational mode
# selection lives under Unverified and Erase remains temporarily for display.
roots = ["FHM.Unverified.Cli", "FHM.Unverified.Live", "FHM.Unverified.Diagnose", "FHM.Unverified.PipelineShared"]

[[lean_exe]]
name = "fhm"
root = "FHM.Unverified.Cli"
# Unified CLI: `fhm diagnose` + `fhm run` (formerly fhm_diagnose / fhm_live).
# Build with `lake build fhm`, scripts/watch-live.sh, or editor tooling.

[[lean_exe]]
name = "fhm_grammar"
root = "FHM.Unverified.GrammarExport"
# Emits TextMate JSON from Surface.Token tables. `scripts/gen-fhm-tmgrammar.sh`

