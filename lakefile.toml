name = "FHM"
version = "0.1.0"
defaultTargets = ["FHM"]

[[lean_lib]]
name = "FHM"
# Default build target = the verified stack.
# Excluded (present in the tree but not built by default):
#   FHM.ConstraintTypeSystem  -- stale vs current Core (pre-fst/snd refactor); kept for reference
roots = [
  "FHM.Core",
  "FHM.Decls",
  "FHM.SurfaceLang",
  "FHM.Surface.Lex",
  "FHM.Surface.Span",
  "FHM.Surface.Parse",
  "FHM.PatComp",
  "FHM.Pretty",
  "FHM.SpikeC",
  "FHM.InferW",
  "FHM.SurfaceBridge",
  "FHM.Scc.Kosaraju",
  "FHM.Scc.BindingGlue",
  "FHM.Examples",
  "FHM.EvaluateUnsafe",
  "FHM.Headlines",
]

[[lean_lib]]
name = "FHMEditor"
# Hover/diagnose helpers — built with `fhm`, not default `lake build`.
roots = ["FHM.EditorSupport"]

[[lean_lib]]
name = "FHMEditorTests"
# Span-hover canaries — `lake build FHMEditorTests`.
roots = ["FHM.EditorSupportTests"]

[[lean_lib]]
name = "FHMCli"
# Unified CLI modules — `lake build fhm`.
roots = ["FHM.Cli", "FHM.Live", "FHM.Diagnose", "FHM.PipelineShared"]

[[lean_exe]]
name = "fhm"
root = "FHM.Cli"
# Unified CLI: `fhm diagnose` + `fhm run` (formerly fhm_diagnose / fhm_live).
# Build with `lake build fhm`, scripts/watch-live.sh, or editor tooling.

[[lean_exe]]
name = "fhm_grammar"
root = "FHM.GrammarExport"
# Emits TextMate JSON from Surface.Lex tables. `scripts/gen-fhm-tmgrammar.sh`

[[lean_lib]]
name = "FHMZ3"
# Optional: Z3 subprocess oracle + BLSketch bound layer.
# Build with `lake build FHMZ3` (requires `z3` on PATH for runtime / #eval).
roots = ["FHM.Z3", "FHM.BLSketch", "FHM.BLSketch.Pretty"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.26.0"

[[require]]
name = "Parser"
git = "https://github.com/fgdorais/lean4-parser"
rev = "b50def30c0b6"
