name = "FHM"
version = "0.1.0"
defaultTargets = ["FHM"]

[[lean_lib]]
name = "FHM"
# Default build target = the verified stack.
roots = [
  "FHM.Core",
  "FHM.CorePath",
  "FHM.Decls",
  "FHM.SurfaceLang",
  "FHM.Surface.Token",
  "FHM.Surface.Span",
  "FHM.PatComp",
  "FHM.Pretty",
  "FHM.InferW",
  "FHM.Completeness",
  "FHM.SurfaceBridge",
  "FHM.Scc.Kosaraju",
  "FHM.Examples",
  "FHM.Headlines",
]

[[lean_lib]]
name = "FHMUnverified"
# Operational front end and evaluator; not part of the default verified stack.
roots = [
  "FHM.Unverified.HMArtifacts",
  "FHM.Unverified.HMDisplay",
  "FHM.Unverified.Surface.Lex",
  "FHM.Unverified.Surface.Parse",
  "FHM.Unverified.Surface.Provenance",
  "FHM.Unverified.Surface.CountScope",
  "FHM.Unverified.EvaluateUnsafe",
]

[[lean_lib]]
name = "FHMEditor"
# Hover/diagnose helpers — built with `fhm`, not default `lake build`.
roots = ["FHM.Unverified.EditorSupport"]

[[lean_lib]]
name = "FHMEditorTests"
# Span-hover canaries — `lake build FHMEditorTests`.
roots = ["FHM.Unverified.EditorSupportTests"]

[[lean_lib]]
name = "FHMCli"
# Unified CLI modules — `lake build fhm`.
# Live imports FHM.Bounds.Pipeline / Erase for `--bl` (pulls FHMBounds + Z3 modules).
roots = ["FHM.Unverified.Cli", "FHM.Unverified.Live", "FHM.Unverified.Diagnose", "FHM.Unverified.PipelineShared"]

[[lean_exe]]
name = "fhm"
root = "FHM.Unverified.Cli"
# Unified CLI: `fhm diagnose` + `fhm run` (formerly fhm_diagnose / fhm_live).
# Build with `lake build fhm`, scripts/watch-live.sh, or editor tooling.

[[lean_exe]]
name = "fhm_grammar"
root = "FHM.Unverified.GrammarExport"
# Emits TextMate JSON from Surface.Token tables. `scripts/gen-fhm-tmgrammar.sh`

[[lean_lib]]
name = "FHMBounds"
# Optional: bounds layer (kernel + Core-attached typing). Not in default FHM.
# Build with `lake build FHMBounds` (Z3 for oracles; Core for Typing).
roots = [
  "FHM.Bounds.Kernel",
  "FHM.Bounds.Ann",       # Z3-free AnnoCount / BoundsAnnTy / ProgramBoundsAnns
  "FHM.Bounds.Report",    # Display ProgramReport (assemble after erase+infer)
  "FHM.Bounds.Oracle",
  "FHM.Bounds.Commit",
  "FHM.Bounds.Typing",
  "FHM.Bounds.Semantic",  # Solver-independent subtype specification and bridge
  "FHM.Bounds.SemanticTests", # Solver-free variance/containment regressions
  "FHM.Bounds.Scheme",    # Count-scheme executable/declarative correspondence
  "FHM.Bounds.SchemeTests", # Count scope, arity and finite-argument regressions
  "FHM.Bounds.CountSubstitution", # Capture-preserving semantic count substitution
  "FHM.Bounds.CountSubstitutionTests", # Capture, simultaneous substitution and premise regressions
  "FHM.Bounds.ScopedScheme", # Quantified stable identities with explicit lexical captures
  "FHM.Bounds.ScopedSchemeTests", # Caller scope, capture and independent-use regressions
  "FHM.Bounds.ScopedAnnotation", # Scope-checked carried annotation demands with HM shape proofs
  "FHM.Bounds.ScopedAnnotationTests", # Nested demands, holes, namespaces and declaration regressions
  "FHM.Bounds.TypeSubstitution", # Capture-safe HM bound-slot/count specialization proofs
  "FHM.Bounds.TypeSubstitutionTests", # Free HM captures and caller-count substitution order
  "FHM.Bounds.BinderBridge", # Certified inferred-slot abstraction and found instantiation
  "FHM.Bounds.BinderBridgeTests", # Repeated slots, captured identities and Core-site regression tests
  "FHM.Bounds.Scope",     # Static count identity and HM-blind renaming contracts
  "FHM.Unverified.Surface.CountScopeTests", # Construction-time telescope regressions
  "FHM.Bounds.Typed",     # Proof-carrying found-driven initial bounds fragment
  "FHM.Bounds.TypedTests", # Initial typed traversal and provenance regressions
  "FHM.Bounds.Escape",    # R3 escape classification (uniqueOnly at pack)
  "FHM.Bounds.Check",     # Live ascription checks (uses Synth)
  "FHM.Bounds.Synth",     # Slice 4: origin HasBounds synthesizer
  "FHM.Bounds.Found",     # Root `.found` → provenance/hover → bounds slice
  "FHM.Bounds.Erase",     # P4b surface BL → List + BoundsAnnTy
  "FHM.Bounds.Pipeline",  # P4c mode / ofLower / prepare (shapes)
  "FHM.Bounds.Examples",  # P3.5c Core demos
]

[[lean_lib]]
name = "FHMZ3"
# Optional: Z3 subprocess oracle + BLSketch bound layer.
# Build with `lake build FHMZ3` (requires `z3` on PATH for runtime / #eval).
roots = ["FHM.Z3", "FHM.Unverified.Z3.Parse", "FHM.BLSketch", "FHM.Unverified.BLSketch.Pretty"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.26.0"

[[require]]
name = "Parser"
git = "https://github.com/fgdorais/lean4-parser"
rev = "b50def30c0b6"
