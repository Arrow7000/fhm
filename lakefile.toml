name = "FHM"
version = "0.1.0"
defaultTargets = ["FHM"]

[[lean_lib]]
name = "FHM"
# Default build target = the modules that currently compile against Core.
# Excluded (present in the tree but not built by default):
#   FHM.ConstraintTypeSystem  -- stale vs current Core (pre-fst/snd refactor)
#   FHM.SpikeC                -- forward draft of letRecAnn (constructors not yet in Core)
roots = [
  "FHM.HasItem",
  "FHM.Core",
  "FHM.InferW",
  "FHM.SurfaceLang",
  "FHM.Pretty",
  "FHM.Examples",
  "FHM.SpikeLetRecAnn",
]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.26.0"
