name = "FHM"
version = "0.1.0"
defaultTargets = ["FHM"]

[[lean_lib]]
name = "FHM"
# Default build target = the verified stack.
roots = [
  "FHM.Core",
  "FHM.CorePath",
  "FHM.Decls",
  "FHM.DeclsTests",
  "FHM.SurfaceLang",
  "FHM.Surface.Token",
  "FHM.Surface.Span",
  "FHM.PatComp",
  "FHM.PatComp.Trace",
  "FHM.Pretty",
  "FHM.InferenceFoundations",
  "FHM.TypedResult",
  "FHM.UnificationTests",
  "FHM.AnnotationMatching",
  "FHM.SourceAnnotations",
  "FHM.SourceSupport",
  "FHM.SourceTyping",
  "FHM.AnnotationAllocation",
  "FHM.AnnotationAllocationTests",
  "FHM.AnnotationErrorTests",
  "FHM.NamedHoleTests",
  "FHM.SurfaceBridge",
  "FHM.LoweringError",
  "FHM.LoweringErrorTests",
  "FHM.SurfaceSafety",
  "FHM.InferW",
  "FHM.InferenceErrorTests",
  "FHM.Completeness",
  "FHM.SignatureMatchingTests",
  "FHM.LetMatchingTests",
  "FHM.RecMatchingTests",
  "FHM.Scc.Kosaraju",
  "FHM.Headlines",
  "FHM.RuntimeTyping",
]

[[lean_lib]]
name = "FHMExamples"
# Executable examples and audit canaries; build with `lake build FHMExamples`.
roots = ["FHM.Examples", "FHM.Examples.Programs", "FHM.RuntimeTyping.PolyRecCanary"]

[[lean_lib]]
name = "FHMHistorical"
# Preserved prototype proofs; build with `lake build FHMHistorical`.
roots = ["FHM.AnnotatedPolyRecErasure", "FHM.AnnotatedPolyRecHybrid"]

[[lean_lib]]
name = "FHMUnverified"
# Operational front end and evaluator; not part of the default verified stack.
roots = [
  "FHM.Unverified.HMArtifacts",
  "FHM.Unverified.HMDisplay",
  "FHM.Unverified.HMReport",
  "FHM.Unverified.TypeDiagnostics",
  "FHM.Unverified.Diagnostics",
  "FHM.Unverified.EditorRecovery",
  "FHM.Unverified.RecoveryArtifacts",
  "FHM.Unverified.ExpressionRecovery",
  "FHM.Unverified.DeclarationRecovery",
  "FHM.Unverified.RecoveryDependencies",
  "FHM.Unverified.ParserRecovery",
  "FHM.Unverified.LexRecovery",
  "FHM.Unverified.CoverageDiagnostics",
  "FHM.Unverified.Surface.Lex",
  "FHM.Unverified.Surface.Parse",
  "FHM.Unverified.Surface.Provenance",
  "FHM.Unverified.EvaluateUnsafe",
]

[[lean_lib]]
name = "FHMEditor"
# Hover/diagnose helpers -- built with `fhm`, not default `lake build`.
roots = ["FHM.Unverified.EditorSupport"]

[[lean_lib]]
name = "FHMEditorTests"
# Editor and runtime canaries -- `lake build FHMEditorTests`.
roots = ["FHM.Unverified.EditorSupportTests", "FHM.Unverified.LiveTests",
  "FHM.Unverified.LoweringErrorTests", "FHM.Unverified.EditorRecoveryTests", "FHM.Unverified.DeclarationRecoveryTests", "FHM.Unverified.ParserRecoveryTests", "FHM.Unverified.LexRecoveryTests", "FHM.Unverified.ExpressionRecoveryTests", "FHM.Unverified.InterfaceRecoveryTests"]

[[lean_lib]]
name = "FHMCli"
# Unified HM CLI modules -- `lake build fhm`.
roots = ["FHM.Unverified.Cli", "FHM.Unverified.Live", "FHM.Unverified.Diagnose"]

[[lean_exe]]
name = "fhm"
root = "FHM.Unverified.Cli"
# `fhm diagnose` and `fhm run`; build with `lake build fhm`.

[[lean_exe]]
name = "fhm_grammar"
root = "FHM.Unverified.GrammarExport"
# Emits TextMate JSON from Surface.Token tables.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.26.0"

[[require]]
name = "Parser"
git = "https://github.com/fgdorais/lean4-parser"
rev = "b50def30c0b6"

[[lean_exe]]
name = "fhm_parser_audit"
root = "FHM.Unverified.ParserAudit"
# Opt-in structural parser differential and generative verification harness.
