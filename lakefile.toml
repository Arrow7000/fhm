name = "FHM"
version = "0.1.0"
defaultTargets = ["FHM"]

[[lean_lib]]
name = "FHM"
# Default build target = the verified stack.
# Excluded (present in the tree but not built by default):
#   FHM.ConstraintTypeSystem  -- stale vs current Core (pre-fst/snd refactor); kept for reference
roots = [
  "FHM.Core",
  "FHM.Decls",
  "FHM.SurfaceLang",
  "FHM.Surface.Lex",
  "FHM.Surface.Parse",
  "FHM.PatComp",
  "FHM.Pretty",
  "FHM.SpikeC",
  "FHM.InferW",
  "FHM.SurfaceBridge",
  "FHM.Examples",
  "FHM.EvaluateUnsafe",
  "FHM.Headlines",
]

[[lean_exe]]
name = "fhm_live"
root = "FHM.Live"
# Not part of defaultTargets — build with `lake build fhm_live` or scripts/watch-live.sh

[[lean_exe]]
name = "fhm_grammar"
root = "FHM.GrammarExport"
# Emits TextMate JSON from Surface.Lex tables. `scripts/gen-fhm-tmgrammar.sh`

[[lean_exe]]
name = "fhm_diagnose"
root = "FHM.Diagnose"
# Parse-only JSON diagnostics for the editor extension.

[[lean_lib]]
name = "FHMZ3"
# Optional: Z3 subprocess oracle + BLSketch bound layer.
# Build with `lake build FHMZ3` (requires `z3` on PATH for runtime / #eval).
roots = ["FHM.Z3", "FHM.BLSketch", "FHM.BLSketch.Pretty"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.26.0"

[[require]]
name = "Parser"
git = "https://github.com/fgdorais/lean4-parser"
rev = "b50def30c0b6"
