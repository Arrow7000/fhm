<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FHM Playground</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="name">FHM</span>
        <span class="tag">playground</span>
      </div>
      <div class="actions">
        <span id="status" class="status">idle</span>
        <button id="run" type="button">Run</button>
      </div>
    </header>
    <main class="panes">
      <div id="editor" class="pane editor"></div>
      <pre id="output" class="pane output" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
