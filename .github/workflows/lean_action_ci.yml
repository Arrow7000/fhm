name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Check verified/unverified boundary
        run: bash scripts/check-unverified-boundary.sh
      - uses: leanprover/lean-action@v1
